general { hide_cursor = true }
background { monitor =; color = rgb(2D1F2D) }
input-field {
    monitor =
    size = 300, 52
    outline_thickness = 3
    dots_size = 0.25
    outer_color = rgb(E1777D)
    inner_color = rgb(43363F)
    font_color = rgb(E8D5AB)
    fade_on_empty = false
    placeholder_text = <i>Enter password</i>
    position = 0, -30
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(E8D5AB)
    font_size = 72
    position = 0, 90
    halign = center
    valign = center
}
